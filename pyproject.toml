[project]
name = "movie-rating-assist"
version = "0.1.0"
description = "Movie content rating assistance system — frame-level multi-label classification"
requires-python = ">=3.10"
dependencies = [
    "katna>=0.9.2",
    "opencv-python>=4.9.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "Pillow>=10.0",
    "huggingface_hub>=0.24",
    "rarfile>=4.1",
    "yt-dlp>=2025.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=8.0",
    "types-tqdm",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_any_explicit = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["Katna.*", "cv2.*", "imageio_ffmpeg.*", "rarfile", "yt_dlp", "transformers", "transformers.*", "cvat_sdk", "cvat_sdk.*"]
ignore_missing_imports = true
